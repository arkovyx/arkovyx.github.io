base_url = "https://arkovyx.github.io"
theme = "duckquill"
compile_sass = true
minify_html = true
build_search_index = true

title = "arkovyx"
description = "Personal website of arkovyx"
author = "arkovyx"

generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]
taxonomies = []

[markdown]
smart_punctuation = true
insert_anchor_links = "left"
bottom_footnotes = true
render_emoji = true

[markdown.highlighting]
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[search]
index_format = "fuse_json"

[extra]
accent_color = "#c9a96e"
default_theme = "dark"
show_copy_button = true
show_reading_time = true

[extra.nav]
show_feed = true
show_theme_switcher = true
show_repo = false
links = [
    { url = "/", name = "~/home" },
    { url = "/blog", name = "Blog" },
    { url = "/nanolog", name = "Nanolog" },
    { url = "/contact", name = "Contact" }
]

[extra.footer]
show_copyright = true
show_powered_by = true
copyright = "© 2026 Arkovyx · All rights reserved"

[extra.author]
name = "Arkovyx"
avatar = "w.png"

[extra.meta]
favicon = "w.png"
apple_touch_icon = "w.png"
