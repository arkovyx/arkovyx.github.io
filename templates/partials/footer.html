<footer id="site-footer">

      <p class="copyright">{{ config.extra.footer.copyright | markdown(inline=true) | safe }}</p>
    {%- endif %}
    {%- if config.extra.footer.show_powered_by %}
      <p class="powered-by">Powered by <a href="https://www.getzola.org">[Zola]</a> and <a href="https://duckquill.daudix.one">[Duckquill]</a></p>
    {%- endif %}

    <ul class="socials">
      <li>

          </svg>
        </a>
      </li>
      <li>
        <a href="https://arkovyx.github.io/keylocity" rel="me" title="Keylocity" aria-label="Keylocity">
          <svg fill="#c9a96e" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.628 16.186l-2.047-2.14 6.791-5.953 1.21 1.302zm8.837 6.047c2.14-2.14 3.535-5.117 3.535-8.466 0-6.604-5.395-12-12-12s-12 5.396-12 12c0 3.35 1.302 6.326 3.535 8.466l1.674-1.675c-1.767-1.767-2.79-4.093-2.79-6.79A9.568 9.568 0 0 1 12 4.185a9.568 9.568 0 0 1 9.581 9.581c0 2.605-1.116 5.024-2.79 6.791Z"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://guthib.com" rel="me" title="X" aria-label="X">
          <svg fill="#c9a96e" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/>
          </svg>
        </a>
      </li>
    </ul>
  </div>

  <style>
    #site-footer {
      display: flex;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    #site-footer > .footer-content {
      width: 100%;
    }

    #site-footer p {
      margin: 0.25rem 0;
    }

    /* Restore the link border that was there before */
    #site-footer a {
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
    }

    /* Strip the border from icon links */
    #site-footer .socials a {
      border-bottom: none;
      padding-bottom: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1rem;
      list-style: none;
      padding: 0;
      margin: 1rem 0 0;
    }

    .socials li { margin: 0; }

    .socials svg {
      display: block;
      transition: transform 160ms ease;
    }

    .socials a:hover svg {
      transform: scale(1.1);
    }
  </style>
</footer>
